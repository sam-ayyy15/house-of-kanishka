# The free Supabase plan pauses a database after 7 days without activity.
# This makes one small read twice a week so the shop's database stays awake.
name: Database keep-alive
on:
  schedule:
    - cron: '17 3 * * 1,4' # Mondays and Thursdays, 03:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/categories?select=slug&limit=1" > /dev/null
          echo "Database answered."
