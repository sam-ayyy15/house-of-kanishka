# Every 2 hours, asks the site to bring Delhivery tracking up to date (latest scan, collected,
# delivered, returning). The site does the work at /api/cron/delhivery; this only knocks on
# the door with the shared secret. Needs the repository secret CRON_SECRET (the same value as
# in Vercel). Optional repository variable SITE_URL (default: the live shop).
name: Delhivery tracking sync
on:
  schedule:
    - cron: '7 */2 * * *' # every 2 hours, at 7 minutes past
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-24.04 # pinned, like the backup
    steps:
      - name: Sync tracking
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.houseofkanishka.in' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl --fail --silent --show-error --max-time 150 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/delhivery"
          echo
